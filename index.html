<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Global ESP32 Control</title>
    <style>
        html { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #121212; color: #ffffff; }
        body { margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h2 { font-size: 2.3rem; margin-bottom: 30px; color: #00adb5; }
        .dashboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 700px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 260px; }
        .push-btn {
            background-color: #333; color: #ffffff; border: 2px solid #00adb5; padding: 15px 30px;
            font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; width: 100%;
        }
        .push-btn:hover { background-color: #00adb5; box-shadow: 0 0 20px rgba(0, 173, 181, 0.6); }
    </style>
    
    <!-- Include Firebase App and Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <h2>ESP32 Cloud Command Center</h2>
    <div class="dashboard">
        <div class="card">
            <h3>Relay 1 (LED)</h3>
            <button class="push-btn" onclick="pressButton(1)">PRESS BUTTON 1</button>
        </div>
        <div class="card">
            <h3>Relay 2</h3>
            <button class="push-btn" onclick="pressButton(2)">PRESS BUTTON 2</button>
        </div>
    </div>

<script>
  // Your Firebase Configuration
  const firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    databaseURL: "https://kkkkk-32e3c-default-rtdb.firebaseio.com/",
    projectId: "kkkkk-32e3c"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  function pressButton(id) {
    // Write 1 to the respective database path to signal the ESP32
    database.ref('press' + id).set(1);
  }
</script>
</body>
</html>
